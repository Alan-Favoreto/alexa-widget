# Every push and pull request: tests + the single-file AlexaWidget.exe as a downloadable artifact.
# A tag like v1.2.0 also publishes a GitHub release with the exe attached.
name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Testes (C#)
        run: dotnet test tests/AlexaWidget.Tests -c Release

      - name: Testes (interface)
        run: npm test

      - name: Publicar AlexaWidget.exe
        run: dotnet publish AlexaWidget.csproj -c Release -r win-x64 -o release

      - uses: actions/upload-artifact@v4
        with:
          name: AlexaWidget
          path: release/AlexaWidget.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: AlexaWidget

      - uses: softprops/action-gh-release@v2
        with:
          files: AlexaWidget.exe
          generate_release_notes: true
